name: Collect jobs
on:
  schedule:
    - cron: "17 11 * * *"   # once a day
  workflow_dispatch:         # lets you run it by hand from the Actions tab
permissions:
  contents: write
concurrency:
  group: collect-jobs
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run collectors
        env:
          USAJOBS_KEY: ${{ secrets.USAJOBS_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
        run: python collect.py
      - name: Save results
        run: |
          git config user.name "job-finder-bot"
          git config user.email "bot@users.noreply.github.com"
          git add jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "Update jobs"
            git pull --rebase
            git push
          fi

name: Collect jobs
on:
  schedule:
    - cron: "17 11 * * *"   # once a day
  workflow_dispatch:         # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run collectors
        run: python collect.py
      - name: Save results
        run: |
          git config user.name "job-finder-bot"
          git config user.email "bot@users.noreply.github.com"
          git add jobs.json
          git diff --cached --quiet || (git commit -m "Update jobs" && git push)
